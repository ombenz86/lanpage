<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Guru - BNZexm CBT</title>
<style>
  :root{
    --bg:#eef1f8; --card:#ffffff; --text:#1c2340; --muted:#6b7392;
    --primary:#4a5590; --primary-d:#38427a; --border:#d9deee; --danger:#c0392b; --accent:#e8ebf7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12162a; --card:#1b2140; --text:#eef0fa; --muted:#9aa2c7; --primary:#7b88d6; --primary-d:#97a2e6; --border:#2d3563; --accent:#252c55; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:760px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(40,50,100,.08)}
  .brand{text-align:center;margin-bottom:22px}
  .brand h1{margin:0;font-size:22px}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:transparent;color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--primary);border-color:transparent}
  select option{color:#1c2340}
  .pw{position:relative}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:8px}
  .btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--primary-d)}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.ghost{background:var(--accent);color:var(--text);margin:0;width:auto;padding:9px 16px;font-size:13px}
  .err{margin-top:14px;color:var(--danger);font-size:14px;text-align:center;min-height:18px}
  .hidden{display:none}
  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .head h2{margin:0;font-size:19px}
  .head p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
  th{background:var(--primary);color:#fff;text-align:left;padding:11px 14px;font-weight:600}
  td{padding:11px 14px;border-top:1px solid var(--border)}
  .token{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.5px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .refresh-info{font-size:12px;color:var(--muted);min-height:16px;margin:-8px 0 10px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <!-- LOGIN -->
    <div id="viewLogin">
      <div class="brand">
        <h1>BNZexm CBT</h1>
        <p>Login Guru untuk melihat token ujian</p>
      </div>
      <label for="nama">Nama Guru</label>
      <select id="nama"><option value="">Memuat daftar guru...</option></select>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" placeholder="Password">
        <button type="button" id="togglePw">Lihat</button>
      </div>
      <button class="btn" id="btnLogin">Masuk</button>
      <div class="err" id="err"></div>
    </div>

    <!-- HASIL -->
    <div id="viewResult" class="hidden">
      <div class="head">
        <div>
          <h2 id="welcome">Halo</h2>
          <p>Berikut token ujian Anda</p>
        </div>
        <div class="actions"><button class="btn ghost" id="btnRefresh">Perbarui Token</button><button class="btn ghost" id="btnLogout">Keluar</button></div>
      </div>
      <div class="refresh-info" id="refreshInfo"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>TOKEN</th><th>MAPEL</th><th>KELAS</th><th>WAKTU</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwAokyOBdnoPizKzFFiBU5xhMh694BjNwQEPEthHng8fTkhvWduOytSF0tF3GsrB4bQ/exec';

const $ = id => document.getElementById(id);

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// JSONP: cara paling andal memanggil Apps Script dari halaman web (tanpa masalah CORS)
function jsonp(){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('script error')); };
    script.src = API_URL + '?callback=' + cb + '&t=' + Date.now();
    document.body.appendChild(script);
  });
}

// Coba JSONP dulu (perlu Code.gs versi baru), jika gagal coba fetch biasa
async function loadData(){
  let j;
  try{
    j = await jsonp();
  }catch(e1){
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      const r = await fetch(API_URL + '?t=' + Date.now(), { signal: ctrl.signal });
      clearTimeout(timer);
      j = await r.json();
    }catch(e2){
      throw new Error('Gagal terhubung ke server. Pastikan Code.gs sudah diperbarui, lalu Deploy > Manage deployments > Edit > New version (Execute as: Me, Access: Anyone).');
    }
  }
  if (!j || j.status !== 'success') throw new Error('Server mengembalikan status gagal');
  return j;
}

const norm = v => String(v == null ? '' : v).trim();

async function initGuru(){
  const sel = $('nama');
  try{
    const j = await loadData();
    const names = [...new Set((j.teacher_data || []).map(g => norm(g['NAMA GURU'])).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'id'));
    sel.innerHTML = '<option value="">-- Pilih nama guru --</option>' +
      names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }catch(e){
    sel.innerHTML = '<option value="">Gagal memuat daftar guru</option>';
    $('err').textContent = e.message;
  }
}

let currentGuru = '';

// Token diambil dari Sheet 1. Jika Sheet 1 punya kolom "NAMA GURU", tampilkan hanya milik guru ini;
// jika tidak ada kolom itu, tampilkan semua baris Sheet 1.
function buildRows(j, namaGuru){
  const exam = j.exam_data || [];
  const adaKolomGuru = exam.some(x => Object.prototype.hasOwnProperty.call(x, 'NAMA GURU'));
  const namaLogin = namaGuru.toLowerCase();
  return exam
    .filter(x => norm(x['TOKEN']) !== '')
    .filter(x => !adaKolomGuru || norm(x['NAMA GURU']).split(/[,;\n]+/).map(n => n.trim().toLowerCase()).includes(namaLogin))
    .map(x => ({
      token: norm(x['TOKEN']),
      mapel: norm(x['MAPEL']),
      kelas: norm(x['KELAS']),
      waktu: norm(x['WAKTU PENGERJAAN'])
    }));
}

async function refreshToken(){
  const btn = $('btnRefresh');
  btn.disabled = true; btn.textContent = 'Memperbarui...';
  $('refreshInfo').textContent = '';
  try{
    const j = await loadData();
    const masihAda = (j.teacher_data || []).some(g => norm(g['NAMA GURU']).toLowerCase() === currentGuru.toLowerCase());
    if (!masihAda){ logout(); $('err').textContent = 'Akun tidak ditemukan, silakan login ulang'; return; }
    showResult({ ok: true, nama: currentGuru, data: buildRows(j, currentGuru) });
    const t = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    $('refreshInfo').textContent = 'Diperbarui ' + t;
  }catch(e){
    $('refreshInfo').textContent = e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Perbarui Token';
  }
}

async function login(){
  const nama = $('nama').value.trim();
  const password = $('password').value;
  $('err').textContent = '';
  if (!nama){ $('err').textContent = 'Pilih nama guru terlebih dahulu'; return; }
  if (!password){ $('err').textContent = 'Password wajib diisi'; return; }

  const btn = $('btnLogin');
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  try{
    const j = await loadData();
    const guru = (j.teacher_data || []).find(g =>
      norm(g['NAMA GURU']).toLowerCase() === nama.toLowerCase() &&
      norm(g['PASSWORD']) === password.trim());
    if (!guru){ $('err').textContent = 'Nama guru atau password salah'; return; }

    currentGuru = norm(guru['NAMA GURU']);
    const data = buildRows(j, currentGuru);
    showResult({ ok: true, nama: currentGuru, data });
  }catch(e){
    $('err').textContent = e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Masuk';
  }
}

function showResult(res){
  $('welcome').textContent = 'Halo, ' + res.nama;
  const rows = res.data || [];
  $('tbody').innerHTML = rows.length
    ? rows.map(r => `
        <tr>
          <td class="token">${esc(r.token)}</td>
          <td>${esc(r.mapel)}</td>
          <td>${esc(r.kelas)}</td>
          <td>${esc(r.waktu)}</td>
        </tr>`).join('')
    : `<tr><td colspan="4" class="empty">Belum ada token di Sheet 1 untuk Anda.</td></tr>`;
  $('viewLogin').classList.add('hidden');
  $('viewResult').classList.remove('hidden');
}

function logout(){
  currentGuru = ''; $('refreshInfo').textContent = '';
  $('password').value = '';
  $('viewResult').classList.add('hidden');
  $('viewLogin').classList.remove('hidden');
}

$('btnLogin').addEventListener('click', login);
$('btnLogout').addEventListener('click', logout);
$('btnRefresh').addEventListener('click', refreshToken);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('nama').addEventListener('change', () => $('password').focus());
initGuru();
$('togglePw').addEventListener('click', () => {
  const p = $('password');
  p.type = p.type === 'password' ? 'text' : 'password';
  $('togglePw').textContent = p.type === 'password' ? 'Lihat' : 'Sembunyi';
});

</script>
</body>
</html>
